<template>
    <div class="chart">
        <div class="chart-head">
            <div class="legend">
                <template for:each={lines} for:item="l">
                    <span key={l.key} class="legend-item"><span class="swatch" style={l.swatch}></span>{l.label}</span>
                </template>
            </div>
            <button class="wr-btn toggle" onclick={toggleTable}>{toggleLabel}</button>
        </div>
        <template lwc:if={hasData}>
            <template lwc:if={showTable}>
                <div class="table-wrap">
                    <table class="wr-table">
                        <thead>
                            <tr>
                                <th>Month</th>
                                <template for:each={lines} for:item="l"><th key={l.key} class="wr-num">{l.label}</th></template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={tableRows} for:item="r">
                                <tr key={r.key}>
                                    <td>{r.month}</td>
                                    <template for:each={r.cells} for:item="c"><td key={c.key} class="wr-num">{c.value}</td></template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template lwc:else>
                <div class="plot">
                    <svg viewBox={viewBox} class="svg" role="img" aria-label={heading}>
                        <template for:each={gridLines} for:item="g">
                            <g key={g.key}>
                                <line x1={g.x1} x2={g.x2} y1={g.y} y2={g.y} class="grid"></line>
                                <text x={g.lx} y={g.ly} class="axis" text-anchor="end">{g.label}</text>
                            </g>
                        </template>
                        <template for:each={xLabels} for:item="xl">
                            <text key={xl.key} x={xl.x} y={xl.y} class="axis" text-anchor="middle">{xl.label}</text>
                        </template>
                        <template lwc:if={hovering}>
                            <line x1={crossX} x2={crossX} y1={crossY1} y2={crossY2} class="cross"></line>
                        </template>
                        <template for:each={lines} for:item="l">
                            <path key={l.key} d={l.path} stroke={l.color} class="line"></path>
                        </template>
                        <template lwc:if={hovering}>
                            <template for:each={lines} for:item="l">
                                <circle key={l.key} cx={l.dotX} cy={l.dotY} r="4" fill={l.color} class="dot"></circle>
                            </template>
                        </template>
                        <template for:each={hitAreas} for:item="h">
                            <rect key={h.key} x={h.x} y={h.y} width={h.w} height={h.h} data-index={h.index}
                                class="hit" onmouseenter={handleEnter} onmouseleave={handleLeave}></rect>
                        </template>
                    </svg>
                    <div class="tooltip" style={tooltipStyle}>
                        <div class="tt-month">{tooltipMonth}</div>
                        <template for:each={lines} for:item="l">
                            <div key={l.key} class="tt-row"><span class="swatch" style={l.swatch}></span><span class="tt-label">{l.label}</span><span class="tt-value">{l.hoverValue}</span></div>
                        </template>
                    </div>
                </div>
            </template>
        </template>
        <template lwc:else>
            <div class="wr-empty">No data for this period.</div>
        </template>
    </div>
</template>
