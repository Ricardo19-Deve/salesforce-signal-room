<template>
    <div class="guide">
        <nav class="toc sr-card" aria-label="Guide sections">
            <div class="sr-section-label">Guide</div>
            <template for:each={toc} for:item="t">
                <button key={t.id} type="button" class={t.cls} data-id={t.id} aria-current={t.ariaCurrent} onclick={select}>
                    <span class="toc-num">{t.num}</span><span>{t.label}</span>
                </button>
            </template>
        </nav>

        <article class="content sr-card">
            <header class="head">
                <div>
                    <div class="eyebrow">{sectionData.num}</div>
                    <h2>{sectionData.title}</h2>
                    <template lwc:if={sectionData.lead}><p class="lead">{sectionData.lead}</p></template>
                </div>
                <template lwc:if={sectionData.hasView}>
                    <button type="button" class="sr-btn" onclick={openPage}><lightning-icon icon-name="utility:forward" size="xx-small" class="sr-btn-icon"></lightning-icon>Open page</button>
                </template>
            </header>

            <template for:each={sectionData.blocks} for:item="b">
                <div key={b.key} class="block">
                    <template lwc:if={b.isH}><h3>{b.h}</h3></template>
                    <template lwc:if={b.isP}><p>{b.p}</p></template>
                    <template lwc:if={b.isNote}><div class="note"><lightning-icon icon-name="utility:info" size="x-small"></lightning-icon><span>{b.note}</span></div></template>
                    <template lwc:if={b.isFormula}><div class="formula">{b.formula}</div></template>
                    <template lwc:if={b.isList}>
                        <ul class="list">
                            <template for:each={b.items} for:item="i"><li key={i.key}>{i.text}</li></template>
                        </ul>
                    </template>
                    <template lwc:if={b.isSteps}>
                        <ol class="steps">
                            <template for:each={b.items} for:item="i">
                                <li key={i.key}><span class="step-num">{i.num}</span><span>{i.text}</span></li>
                            </template>
                        </ol>
                    </template>
                    <template lwc:if={b.isTable}>
                        <div class="table-wrap">
                            <table class="sr-table">
                                <thead><tr><template for:each={b.head} for:item="h"><th key={h.key}>{h.text}</th></template></tr></thead>
                                <tbody>
                                    <template for:each={b.rows} for:item="r">
                                        <tr key={r.key}><template for:each={r.cells} for:item="c"><td key={c.key} class={c.cls}>{c.text}</td></template></tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </div>
            </template>

            <template lwc:if={showRules}>
                <div class="block">
                    <h3>Active rule settings in this org</h3>
                    <p class="sr-muted">Read live from the rule records, so this table always matches what the engine uses.</p>
                    <div class="table-wrap">
                        <table class="sr-table">
                            <thead>
                                <tr><th>Rule</th><th>Type</th><th class="sr-num">Threshold</th><th class="sr-num">Min value</th><th class="sr-num">Lookback</th><th class="sr-num">Recent</th><th class="sr-num">Weight</th><th>Active</th></tr>
                            </thead>
                            <tbody>
                                <template for:each={ruleRows} for:item="r">
                                    <tr key={r.id}>
                                        <td class="cell-first"><div>{r.name}</div><div class="sr-faint rule-desc">{r.description}</div></td>
                                        <td class="sr-muted">{r.type}</td>
                                        <td class="sr-num">{r.threshold}</td>
                                        <td class="sr-num">{r.minValue}</td>
                                        <td class="sr-num">{r.lookback}</td>
                                        <td class="sr-num">{r.recent}</td>
                                        <td class="sr-num">{r.weight}</td>
                                        <td>{r.active}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>

            <footer class="pager">
                <template lwc:if={sectionData.prev}>
                    <button type="button" class="pager-btn" onclick={goPrev}><span class="sr-faint">Previous</span><span>{sectionData.prev.title}</span></button>
                </template>
                <span class="spacer"></span>
                <template lwc:if={sectionData.next}>
                    <button type="button" class="pager-btn pager-btn_next" onclick={goNext}><span class="sr-faint">Next</span><span>{sectionData.next.title}</span></button>
                </template>
            </footer>
        </article>
    </div>
</template>
