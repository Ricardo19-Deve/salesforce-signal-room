<template>
    <div class={hostClass}>
        <header class="topbar">
            <div class="brand">
                <div class="logo">WR</div>
                <div class="brand-text">
                    <div class="brand-name">{brandName}</div>
                    <div class="app-name">{appName}</div>
                </div>
            </div>
            <nav class="nav" data-tour="nav">
                <template for:each={navItems} for:item="n">
                    <button key={n.view} class={n.cls} data-view={n.view} onclick={handleNav}>
                        <lightning-icon icon-name={n.icon} size="x-small" variant="inverse" class="nav-icon"></lightning-icon>
                        <span>{n.label}</span>
                    </button>
                </template>
            </nav>
            <button type="button" class={guideBtnClass} onclick={openGuide} title="How the Win Room works" data-tour="guide">
                <lightning-icon icon-name="utility:help" size="x-small" variant="inverse"></lightning-icon>
                <span>Guide</span>
            </button>
            <div class="me" title={userName}>
                <span class="avatar">{userInitials}</span>
            </div>
        </header>

        <div class="pagebar">
            <div class="page-title">
                <h1>{current.label}<template lwc:if={hasTour}><button type="button" class="tour-btn" onclick={startTour} title="Highlights each part of this page and explains it"><lightning-icon icon-name="utility:play" size="xx-small"></lightning-icon><span>Tour</span></button></template></h1>
                <p>{current.subtitle}<template lwc:if={showPageGuide}><span class="sep">·</span><span class="wr-link page-guide" onclick={openPageGuide}>How this page works</span></template></p>
            </div>
            <div class="page-tools">
                <template lwc:if={showFilters}>
                    <div class="filters" data-tour="filters">
                    <c-win-room-segmented label="Scope" options={scopeOptions} value={scope} onchange={handleScope}></c-win-room-segmented>
                    <c-win-room-select label="Country" options={countryOptions} value={country} onchange={handleCountry}></c-win-room-select>
                    </div>
                </template>
                <span class={runChipClass} title={lastRunText} data-tour="run">{lastRunText}</span>
            </div>
        </div>

        <main class="content">
            <template lwc:if={error}>
                <div class="wr-alert wr-alert_error" role="alert">{error}</div>
            </template>
            <template lwc:if={isEmpty}>
                <div class="onboarding wr-card">
                    <div class="wr-card-title">No pointers yet</div>
                    <p class="wr-muted">The Win Room engine has not produced any opportunity pointers in this org.</p>
                    <template lwc:if={isAdmin}>
                        <p class="wr-muted">Open <b>Rules &amp; Data</b> to generate demo data for the sandbox and run the engine.</p>
                        <button class="wr-btn wr-btn_primary onboarding-btn" onclick={goAdmin}>Open Rules &amp; Data</button>
                    </template>
                </div>
            </template>
            <template lwc:if={isDashboard}>
                <c-win-room-dashboard data-tour-host scope={scope} country={country} refresh-key={refreshKey}
                    onopenpointer={handleOpenPointer} onopenaccount={handleOpenAccount}></c-win-room-dashboard>
            </template>
            <template lwc:if={isPointers}>
                <c-win-room-pointers data-tour-host scope={scope} country={country} refresh-key={refreshKey}
                    onopenpointer={handleOpenPointer} onopenaccount={handleOpenAccount}></c-win-room-pointers>
            </template>
            <template lwc:if={isAccount}>
                <c-win-room-account360 data-tour-host account-id={selectedAccountId} refresh-key={refreshKey}
                    onopenpointer={handleOpenPointer}></c-win-room-account360>
            </template>
            <template lwc:if={isWinRoom}>
                <c-win-room-session data-tour-host refresh-key={refreshKey}
                    onopenpointer={handleOpenPointer} onopenaccount={handleOpenAccount}></c-win-room-session>
            </template>
            <template lwc:if={isContracts}>
                <c-win-room-contracts data-tour-host is-admin={isAdmin} refresh-key={refreshKey}
                    onopenpointer={handleOpenPointer} onopenaccount={handleOpenAccount}></c-win-room-contracts>
            </template>
            <template lwc:if={isMarket}>
                <c-win-room-market data-tour-host is-admin={isAdmin} ondatachanged={handleDataChanged}></c-win-room-market>
            </template>
            <template lwc:if={isTenders}>
                <c-win-room-tenders data-tour-host is-admin={isAdmin} ondatachanged={handleDataChanged} onopenaccount={handleOpenAccount}></c-win-room-tenders>
            </template>
            <template lwc:if={isGuide}>
                <c-win-room-guide section={guideSection} onnavigate={handleGuideNavigate}></c-win-room-guide>
            </template>
            <template lwc:if={isAdminView}>
                <c-win-room-admin data-tour-host ondatachanged={handleDataChanged}></c-win-room-admin>
            </template>
        </main>

        <template lwc:if={tourOn}>
            <div class="tour" role="presentation" tabindex="-1" onkeydown={handleTourKey}>
                <div class={shadeClass} style={shadeStyle}></div>
                <section class={tourPopClass} style={popStyle} role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-body">
                    <div class="tour-count">{tourCount}</div>
                    <h3 id="tour-title">{tourStep.title}</h3>
                    <p id="tour-body">{tourStep.body}</p>
                    <template lwc:if={tourStep.data}>
                        <div class="tour-data"><span class="tour-data-label">Data</span><span>{tourStep.data}</span></div>
                    </template>
                    <template lwc:if={tourMissing}>
                        <div class="tour-missing">There is no data for this block in this org yet, so it is not on screen.</div>
                    </template>
                    <div class="tour-progress" aria-hidden="true"><div class="tour-progress-fill" style={progressStyle}></div></div>
                    <div class="tour-actions">
                        <button type="button" class="wr-btn tour-skip" onclick={endTour}>End tour</button>
                        <span class="tour-spacer"></span>
                        <button type="button" class="wr-btn" onclick={tourBack} disabled={tourFirst}>Back</button>
                        <button type="button" class="wr-btn wr-btn_primary tour-next" onclick={tourNext}>{tourNextLabel}</button>
                    </div>
                </section>
            </div>
        </template>

        <template lwc:if={showDetail}>
            <div class="backdrop" onclick={handleCloseDetail}></div>
            <aside class="drawer">
                <c-win-room-pointer-detail pointer-id={selectedPointerId} onclose={handleCloseDetail}
                    onchanged={handlePointerChanged} onopenaccount={handleOpenAccount}></c-win-room-pointer-detail>
            </aside>
        </template>
    </div>
</template>
