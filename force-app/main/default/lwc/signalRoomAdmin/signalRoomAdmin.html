<template>
    <template lwc:if={error}>
        <div class="sr-alert sr-alert_error" role="alert">{error}</div>
    </template>
    <template lwc:if={message}>
        <div class="sr-alert sr-alert_info msg" role="status">
            {message}
            <button type="button" class="sr-icon-btn" title="Dismiss" aria-label="Dismiss" onclick={dismissMessage}><lightning-icon icon-name="utility:close" size="x-small"></lightning-icon></button>
        </div>
    </template>

    <div class="sr-tabs" role="tablist">
        <template for:each={tabs} for:item="t">
            <button key={t.key} type="button" role="tab" class={t.cls} aria-selected={t.selected} data-tab={t.key} onclick={selectTab}>{t.label}</button>
        </template>
    </div>
        <template lwc:if={tab_rules}>
            <div class="sr-card">
                <div class="sr-card-title">
                    Opportunity identification rules
                    <span class="sr-card-sub">evaluated by the engine for every in-scope account</span>
                    <div class="push">
                        <button type="button" class="sr-btn" onclick={doResetRules}>Reset to defaults</button>
                        <button type="button" class="sr-btn" onclick={newRule}><lightning-icon icon-name="utility:add" size="xx-small" class="sr-btn-icon"></lightning-icon>New rule</button>
                        <button type="button" class="sr-btn sr-btn_primary" onclick={doRun} disabled={busy}><lightning-icon icon-name="utility:play" size="xx-small" class="sr-btn-icon"></lightning-icon>Run engine now</button>
                    </div>
                </div>
                <table class="sr-table">
                    <thead>
                        <tr>
                            <th>Active</th><th>Rule</th><th>Type</th><th>Category</th><th class="sr-num">Weight</th>
                            <th class="sr-num">Threshold</th><th class="sr-num">Min value</th><th class="sr-num">Lookback / recent</th>
                            <th>Lines</th><th class="sr-num">Ratio</th><th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={ruleRows} for:item="r">
                            <tr key={r.Id}>
                                <td><button type="button" class="sr-icon-btn" title="Toggle active" aria-label="Toggle active" data-id={r.Id} onclick={toggleRule}><lightning-icon icon-name={r.activeIcon} size="x-small"></lightning-icon></button></td>
                                <td><div class="sr-strong">{r.Name}</div><div class="sr-muted">{r.Description__c}</div></td>
                                <td class="sr-muted" title={r.help}>{r.typeLabel}<template lwc:if={r.isCustom}><span class="sr-tag custom-tag">Custom</span></template></td>
                                <td>{r.Category__c}</td>
                                <td class="sr-num">{r.Weight__c}</td>
                                <td class="sr-num">{r.thresholdText}</td>
                                <td class="sr-num">{r.minText}</td>
                                <td class="sr-num">{r.lookbackText}</td>
                                <td class="sr-muted">{r.lines}</td>
                                <td class="sr-num">{r.Expected_Ratio__c}</td>
                                <td><button type="button" class="sr-icon-btn" title="Edit" aria-label="Edit" data-id={r.Id} onclick={editRule}><lightning-icon icon-name="utility:edit" size="x-small"></lightning-icon></button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <template lwc:if={editing}>
                <div class="modal-backdrop" onclick={cancelEdit}></div>
                <section class="modal" role="dialog" aria-modal="true" aria-labelledby="rule-modal-title" onkeydown={handleModalKey}>
                    <header class="modal-head">
                        <div>
                            <div class="sr-section-label">{modalEyebrow}</div>
                            <h2 id="rule-modal-title">{modalTitle}</h2>
                        </div>
                        <button type="button" class="sr-icon-btn" title="Close" aria-label="Close" onclick={cancelEdit}><lightning-icon icon-name="utility:close" size="x-small"></lightning-icon></button>
                    </header>
                    <div class="modal-body">
                        <div class="sr-grid sr-grid_2">
                            <label class="sr-field"><span class="sr-field-label">Name</span><input class="sr-input rule-name" type="text" value={editing.Name} data-field="Name" oninput={handleRuleField} /></label>
                            <template lwc:if={isNewRule}>
                                <label class="sr-field"><span class="sr-field-label">Code (unique)</span><input class="sr-input" type="text" value={editing.Code__c} data-field="Code__c" oninput={handleRuleField} /></label>
                            </template>
                            <template lwc:else>
                                <div class="sr-field"><span class="sr-field-label">Code</span><div class="code">{editing.Code__c}</div></div>
                            </template>
                            <c-signal-room-select variant="field" label="Rule type" value={editing.Rule_Type__c} options={ruleTypeOptions} data-field="Rule_Type__c" onchange={handleRuleField}></c-signal-room-select>
                            <c-signal-room-select variant="field" label="Category" value={editing.Category__c} options={categoryOptions} data-field="Category__c" onchange={handleRuleField}></c-signal-room-select>
                        </div>
                        <div class="type-help"><lightning-icon icon-name="utility:info" size="x-small"></lightning-icon><span>{editHelp}</span></div>

                        <div class="sr-section-label group">Parameters</div>
                        <div class="sr-grid sr-grid_3">
                            <label class="sr-field"><span class="sr-field-label">Weight (1-5)</span><input class="sr-input" type="number" min="1" max="5" value={editing.Weight__c} data-field="Weight__c" oninput={handleRuleField} /></label>
                            <template for:each={paramFields} for:item="f">
                                <label key={f.field} class="sr-field"><span class="sr-field-label">{f.label}</span><input class="sr-input" type="number" step={f.step} value={f.value} data-field={f.field} oninput={handleRuleField} /></label>
                            </template>
                        </div>
                        <template for:each={lineFields} for:item="f">
                            <div key={f.field} class="sr-field lines-field">
                                <span class="sr-field-label">{f.label}</span>
                                <div class="chips">
                                    <template for:each={f.chips} for:item="c">
                                        <button key={c.code} type="button" class={c.cls} aria-pressed={c.pressed} title={c.name} data-field={f.field} data-code={c.code} onclick={toggleLine}>{c.code}</button>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <div class="sr-section-label group">Playbook</div>
                        <label class="sr-field"><span class="sr-field-label">Description (why the pointer exists)</span><textarea class="sr-input sr-textarea" value={editing.Description__c} data-field="Description__c" oninput={handleRuleField}></textarea></label>
                        <label class="sr-field"><span class="sr-field-label">Next best action</span><textarea class="sr-input sr-textarea" value={editing.Next_Best_Action__c} data-field="Next_Best_Action__c" oninput={handleRuleField}></textarea></label>
                    </div>
                    <footer class="modal-foot">
                        <label class="sr-switch"><input type="checkbox" checked={editing.Active__c} data-field="Active__c" onchange={handleRuleField} /><span class="sr-switch-ui"></span><span>Active</span></label>
                        <template lwc:if={canDelete}>
                            <button type="button" class="sr-btn sr-btn_danger-text" onclick={deleteEditing} disabled={busy}>Delete rule</button>
                        </template>
                        <span class="spacer"></span>
                        <button type="button" class="sr-btn" onclick={cancelEdit}>Cancel</button>
                        <button type="button" class="sr-btn sr-btn_primary" onclick={saveEditing} disabled={saveDisabled}>{saveLabel}</button>
                    </footer>
                </section>
            </template>
        </template>

        <template lwc:if={tab_runs}>
            <div class="sr-card">
                <div class="sr-card-title">
                    Engine runs
                    <div class="push"><button type="button" class="sr-btn sr-btn_primary" onclick={doRun} disabled={busy}><lightning-icon icon-name="utility:play" size="xx-small" class="sr-btn-icon"></lightning-icon>Run engine now</button></div>
                </div>
                <table class="sr-table">
                    <thead>
                        <tr><th>Run</th><th>Status</th><th>Started</th><th class="sr-num">Duration</th><th class="sr-num">Accounts</th><th class="sr-num">New</th><th class="sr-num">Updated</th><th class="sr-num">Expired</th><th>By</th></tr>
                    </thead>
                    <tbody>
                        <template for:each={runRows} for:item="r">
                            <tr key={r.Id}>
                                <td class="sr-strong">{r.Name}<div class="sr-muted msg-text">{r.Message__c}</div></td>
                                <td><span class={r.cls}>{r.Status__c}</span></td>
                                <td>{r.started}</td>
                                <td class="sr-num">{r.duration}</td>
                                <td class="sr-num">{r.Accounts_Processed__c}</td>
                                <td class="sr-num">{r.Pointers_New__c}</td>
                                <td class="sr-num">{r.Pointers_Updated__c}</td>
                                <td class="sr-num">{r.Pointers_Expired__c}</td>
                                <td class="sr-muted">{r.CreatedBy.Name}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template lwc:if={tab_data}>
            <div class="stats">
                <template for:each={statTiles} for:item="s">
                    <div key={s.key} class="sr-card sr-kpi">
                        <div class="sr-kpi-label">{s.label}</div>
                        <div class="sr-kpi-value">{s.value}</div>
                        <div class="sr-kpi-hint">{s.hint}</div>
                    </div>
                </template>
            </div>
            <div class="sr-grid sr-grid_3 section">
                <div class="sr-card">
                    <div class="sr-card-title">Generate demo data (sandbox)</div>
                    <p class="sr-muted">Creates profiles on the existing hospital accounts (Account is not modified), surgeons, tenders, signal room sessions and 24 months of sales (18 in Developer Edition orgs) with planted churn, switch, cross-sell, surgeon and tender patterns. Safe to re-run.</p>
                    <div class="gen-options"><label class="sr-check"><input type="checkbox" checked={assignToMe} onchange={handleAssign} /><span class="sr-check-ui"></span><span>Assign the accounts to me and my demo team (otherwise to the account owners)</span></label>
                    <label class="sr-check"><input type="checkbox" checked={runAfter} onchange={handleRunAfter} /><span class="sr-check-ui"></span><span>Run the engine when the data is ready</span></label></div>
                    <button type="button" class="sr-btn sr-btn_primary sr-mt-s" onclick={doGenerate} disabled={busy}><lightning-icon icon-name="utility:database" size="xx-small" class="sr-btn-icon"></lightning-icon>Generate demo data</button>
                </div>
                <div class="sr-card">
                    <div class="sr-card-title">Demo team</div>
                    <p class="sr-muted">Creates six fictitious reps (Chatter Free users, no welcome e-mail, no Salesforce licence) whose manager is you. Generate the demo data afterwards to spread the accounts across the team, so the All / Mine / My team filters show different numbers. My team = you and the users whose manager you are.</p>
                    <button type="button" class="sr-btn gen-actions" onclick={doCreateTeam} disabled={busy}><lightning-icon icon-name="utility:groups" size="xx-small" class="sr-btn-icon"></lightning-icon>Create demo team</button>
                </div>
                <div class="sr-card">
                    <div class="sr-card-title">Purge demo data</div>
                    <p class="sr-muted">Deletes every Signal Room record flagged as demo plus engine runs. Opportunities created from pointers are not deleted.</p>
                    <button type="button" class="sr-btn sr-btn_danger gen-actions" onclick={doPurge} disabled={busy}><lightning-icon icon-name="utility:delete" size="xx-small" class="sr-btn-icon"></lightning-icon>Purge demo data</button>
                    <div class="sr-muted sr-mt-s">{jobText}</div>
                </div>
            </div>
            <div class="sr-card section" data-tour="scope">
                <div class="sr-card-title">Account scope <span class="sr-card-sub">pointers are generated for in-scope accounts; all profiles feed the peer benchmarks</span></div>
                <table class="sr-table">
                    <thead><tr><th>Account</th><th>Country</th><th>Segment</th><th>Size</th><th class="sr-num">Knees / hips</th><th>Phase</th><th>In scope</th><th>Rep</th></tr></thead>
                    <tbody>
                        <template for:each={profileRows} for:item="p">
                            <tr key={p.Id}>
                                <td class="sr-strong">{p.Name}</td>
                                <td>{p.Country__c}</td>
                                <td>{p.Segment__c}</td>
                                <td>{p.Size_Band__c}</td>
                                <td class="sr-num">{p.Knee_Procedures__c} / {p.Hip_Procedures__c}</td>
                                <td class="phase"><c-signal-room-select value={p.Phase__c} options={phaseOptions} data-id={p.Id} onchange={changePhase}></c-signal-room-select></td>
                                <td><label class="sr-switch"><input type="checkbox" checked={p.In_Scope__c} data-id={p.Id} onchange={toggleScope} /><span class="sr-switch-ui"></span></label></td>
                                <td class="sr-muted">{p.repName}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>

        <template lwc:if={tab_lines}>
            <div class="sr-card">
                <div class="sr-card-title">Product lines <span class="sr-card-sub">material-to-system mapping used by the rules (codes are referenced in rule anchor/target lines)</span></div>
                <table class="sr-table">
                    <thead><tr><th>Code</th><th>Product line</th><th>System</th><th>Category</th><th>Component</th><th class="sr-num">Avg price</th><th>Capital</th></tr></thead>
                    <tbody>
                        <template for:each={lineRows} for:item="l">
                            <tr key={l.Id}>
                                <td class="sr-strong">{l.Code__c}</td>
                                <td>{l.Name}</td>
                                <td>{l.System__c}</td>
                                <td>{l.Category__c}</td>
                                <td>{l.Component__c}</td>
                                <td class="sr-num">{l.price}</td>
                                <td>{l.Is_Capital__c}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
</template>
